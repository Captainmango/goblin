# yaml-language-server: $schema=../spec/v1.json

version: v1
workflow:
  name: my_workflow
  vars:
    repo: https://github.com/parkhub/justpark.git
  defaults:
    mcp_servers: 
      github:
        command: npx
        args:
          - -y
          - "@modelcontextprotocol/server-github"
        env:
          GITHUB_TOKEN: $GITHUB_TOKEN
    
  steps:
    - id: clone_repo
      prompt: "Clone {repo} into /tmp/justpark"
      allowed_tools: [Bash]
      on_failure:
        action: abort
    - id: load_project
      load_project: /tmp/justpark
    - id: summarise_project
      prompt: "Summarise what this project is and how it works. Use CLAUDE.md."
      allowed_tools: [Read, Glob]

