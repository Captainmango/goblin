# yaml-language-server: $schema=../spec/v1.json

version: 1
workflow:
  name: my_workflow
  vars:
    repo: https://github.com/parkhub/justpark.git
  steps:
    - id: clone_repo
      prompt: "Clone https://github.com/parkhub/justpark.git into /tmp/justpark"
      allowed_tools: [Bash]
    - id: load_project
      load_project: /tmp/justpark
    - id: do_work
      prompt: "Read the project README and summarize what this project does"
      allowed_tools: [Read, Glob]
