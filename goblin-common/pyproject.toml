[project]
name = "goblin-common"
version = "0.1.0"
description = "Shared utilities for the Goblin monorepo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goblin_common"]

[tool.pyrefly]
project-includes = ["goblin_common/**/*.py"]

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "pyrefly>=0.54.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.4",
]
