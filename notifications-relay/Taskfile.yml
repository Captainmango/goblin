# https://taskfile.dev

version: '3'

tasks:
  lint:
    cmds:
      - uv run ruff check .
    silent: true

  format:
    cmds:
      - uv run ruff format .
    silent: true

  typecheck:
    cmds:
      - uv run pyrefly check
    silent: true

  test:
    cmds:
      - uv run pytest
    silent: true

  build:
    cmds:
      - docker build -f ../infra/docker/notifications-relay/Dockerfile .. -t notifications-relay