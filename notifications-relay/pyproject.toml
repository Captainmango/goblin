[project]
name = "notifications-relay"
version = "0.1.0"
description = "Notification relay service for the Goblin ecosystem"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "pydantic>=2.12.5",
]

[project.scripts]
notifications-relay = "notifications_relay.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notifications_relay"]

[tool.pyrefly]
project-includes = ["notifications_relay/**/*.py"]

known-first-party = ["notifications_relay"]

[dependency-groups]
dev = [
    "pyrefly>=0.54.0",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]
