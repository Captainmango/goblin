[project]
name = "notifications-relay"
version = "0.1.0"
description = "Notification relay service for the Goblin ecosystem"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite",
    "click>=8.3.1",
    "fastapi",
    "goblin-common",
    "httpx",
    "pydantic>=2.12.5",
    "python-telegram-bot",
    "uvicorn[standard]",
]

[project.scripts]
notifications-relay = "notifications_relay.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notifications_relay"]

[tool.uv.sources]
goblin-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyrefly]
project-includes = ["notifications_relay/**/*.py"]

[dependency-groups]
dev = [
    "pyrefly>=0.54.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.4",
]
