# https://taskfile.dev

version: '3'

includes:
  goblin:
    taskfile: ./goblin/Taskfile.yml
    dir: ./goblin
  goblin-common:
    taskfile: ./goblin-common/Taskfile.yml
    dir: ./goblin-common
  goblin-docs:
    taskfile: ./goblin-docs/Taskfile.yml
    dir: ./goblin-docs
  notifications-relay:
    taskfile: ./notifications-relay/Taskfile.yml
    dir: ./notifications-relay

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Create a virtual environment and install dependencies
    cmds:
      - python -m venv .venv
      - uv sync --all-packages --all-groups
    silent: true

  lint:
    cmds:
      - task goblin:lint
      - task goblin-common:lint
      - task notifications-relay:lint
    silent: true

  format:
    cmds:
      - task goblin:format
      - task goblin-common:format
      - task notifications-relay:format
    silent: true

  typecheck:
    cmds:
      - task goblin:typecheck
      - task goblin-common:typecheck
      - task notifications-relay:typecheck
    silent: true

  test:
    cmds:
      - task goblin:test
      - task goblin-common:test
      - task notifications-relay:test
    silent: true

  validate:
    cmds:
      - task goblin:validate
    silent: true

  base:build:
    cmds:
      - docker build -f ./infra/docker/base/Dockerfile . -t jp-goblin #replace this with a taskfile var at some point 