# https://taskfile.dev

version: '3'

tasks:
  lint:
    cmds:
      - uv run ruff check .
    silent: true

  format:
    cmds:
      - uv run ruff format .
    silent: true

  typecheck:
    cmds:
      - uv run pyrefly check
    silent: true

  validate:
    cmds:
      - uv run goblin validate blueprints/*.yaml
    silent: true
