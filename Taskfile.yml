# https://taskfile.dev

version: '3'

includes:
  goblin-cli:
    taskfile: ./goblin-cli/Taskfile.yml
    dir: ./goblin-cli
  goblin-tools:
    taskfile: ./goblin-tools/Taskfile.yml
    dir: ./goblin-tools
  notifications-relay:
    taskfile: ./notifications-relay/Taskfile.yml
    dir: ./notifications-relay

tasks:
  default:
    cmds:
      - task --list
    silent: true

  lint:
    cmds:
      - task goblin-cli:lint
      - task goblin-tools:lint
      - task notifications-relay:lint
    silent: true

  format:
    cmds:
      - task goblin-cli:format
      - task goblin-tools:format
      - task notifications-relay:format
    silent: true

  typecheck:
    cmds:
      - task goblin-cli:typecheck
      - task goblin-tools:typecheck
      - task notifications-relay:typecheck
    silent: true

  test:
    cmds:
      - task goblin-cli:test
      - task goblin-tools:test
      - task notifications-relay:test
    silent: true

  validate:
    cmds:
      - task goblin-cli:validate
    silent: true
