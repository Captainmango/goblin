# https://taskfile.dev

version: '3'

vars:
  ZENSICAL_VERSION: ">=0.0.50,<0.1"

includes:
  goblin:
    taskfile: ./goblin/Taskfile.yml
    dir: ./goblin
  goblin-common:
    taskfile: ./goblin-common/Taskfile.yml
    dir: ./goblin-common

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Create a virtual environment and install dependencies
    cmds:
      - python -m venv .venv
      - uv sync --all-packages --all-groups
    silent: true

  lint:
    cmds:
      - task goblin:lint
      - task goblin-common:lint
      - task goblin:check-imports
    silent: true

  format:
    cmds:
      - task goblin:format
      - task goblin-common:format
    silent: true

  typecheck:
    cmds:
      - task goblin:typecheck
      - task goblin-common:typecheck
    silent: true

  test:
    cmds:
      - task goblin:test
      - task goblin-common:test
      - task goblin:check-imports
    silent: true

  validate:
    cmds:
      - task goblin:validate
      - task goblin:check-cassettes
    silent: true
  
  skills:sync-references:
    desc: Sync docs and schema into the shared skills/references snapshot
    cmds:
      - uv run python scripts/sync_skill_references.py
    silent: true

  docs:serve:
    cmds:
      - uvx 'zensical{{.ZENSICAL_VERSION}}' serve

  docs:build:
    cmds:
      - uvx 'zensical{{.ZENSICAL_VERSION}}' build

  base:build:
    cmds:
      - docker build -f ./infra/docker/base/Dockerfile . -t jp-goblin #replace this with a taskfile var at some point 