# https://taskfile.dev

version: '3'

tasks:
  lint:
    cmds:
      - uv run ruff check .
    silent: true

  format:
    cmds:
      - uv run ruff format .
    silent: true

  typecheck:
    cmds:
      - uv run pyrefly check

  test:
    desc: Run unit tests for the project
    cmds:
      - uv run pytest tests/unit
    silent: true

  validate:
    desc: Validate all example blueprints
    cmds:
      - uv run goblin validate ../examples/*.yaml
    silent: true

  check-imports:
    desc: Fail if goblin.cli import time exceeds 500 ms
    cmds:
      - uv run python ../scripts/check_import_time.py
    silent: true

  check-cassettes:
    desc: Validate checked-in VCR cassettes contain no leaked secrets
    cmds:
      - uv run python ../scripts/check_cassettes.py
    silent: true

  setup:build-tools:
    desc: Install system toolchain for faster Nuitka compilation
    cmds:
      - |
        if command -v apt-get >/dev/null 2>&1; then
          echo "Installing build tools with apt-get..."
          sudo apt-get update
          sudo apt-get install -y clang ccache mold
        elif command -v dnf >/dev/null 2>&1; then
          echo "Installing build tools with dnf..."
          sudo dnf install -y clang ccache mold
        elif command -v pacman >/dev/null 2>&1; then
          echo "Installing build tools with pacman..."
          sudo pacman -S --needed clang ccache mold
        elif command -v brew >/dev/null 2>&1; then
          echo "Installing build tools with brew..."
          brew install llvm ccache
          echo "Note: On macOS Nuitka uses the system linker by default. lld is available via the llvm formula."
        else
          echo "No supported package manager found. Please install clang, ccache, and mold (or lld) manually."
          exit 1
        fi
    silent: true

  build-binary:
    desc: Compile the goblin CLI to a native binary with Nuitka (standalone)
    cmds:
      - |
        NUITKA_FLAGS=(
          --mode=standalone
          --main=goblin/__main__.py
          --output-dir=../dist/nuitka
          --output-filename=goblin
          --include-package=goblin
          --include-package-data=goblin
          "--nofollow-import-to=*.tests"
          --assume-yes-for-downloads
          --remove-output
          --jobs="$(nproc)"
          --show-progress
          --lto=no
        )
        if command -v clang >/dev/null 2>&1; then
          echo "Using clang compiler"
          NUITKA_FLAGS+=(--clang)
        else
          echo "clang not found; using default compiler (install with 'task goblin:setup:build-tools')"
        fi
        if command -v mold >/dev/null 2>&1; then
          echo "Using mold linker"
          export LDFLAGS="-fuse-ld=mold${LDFLAGS:+ $LDFLAGS}"
        elif command -v lld >/dev/null 2>&1; then
          echo "Using lld linker"
          export LDFLAGS="-fuse-ld=lld${LDFLAGS:+ $LDFLAGS}"
        else
          echo "mold/lld not found; using default linker (install with 'task goblin:setup:build-tools')"
        fi
        if command -v ccache >/dev/null 2>&1; then
          echo "ccache detected; Nuitka will use it automatically"
        else
          echo "ccache not found; install with 'task goblin:setup:build-tools' to cache object files"
        fi
        uv run python -m nuitka "${NUITKA_FLAGS[@]}"
    silent: true
