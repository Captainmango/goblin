# https://taskfile.dev

version: '3'

tasks:
  lint:
    cmds:
      - uv run ruff check .
    silent: true

  format:
    cmds:
      - uv run ruff format .
    silent: true

  typecheck:
    cmds:
      - uv run pyrefly check

  test:
    desc: Run unit tests for the project
    cmds:
      - uv run pytest tests/unit
    silent: true

  validate:
    desc: Validate all example blueprints
    cmds:
      - uv run goblin validate ../examples/*.yaml
    silent: true

  check-imports:
    desc: Fail if goblin.cli import time exceeds 500 ms
    cmds:
      - uv run python ../scripts/check_import_time.py
    silent: true

  check-cassettes:
    desc: Validate checked-in VCR cassettes contain no leaked secrets
    cmds:
      - uv run python ../scripts/check_cassettes.py
    silent: true

  build-binary:
    desc: Compile the goblin CLI to a native binary with Nuitka (standalone)
    cmds:
      - uv run python -m nuitka --mode=standalone --main=goblin/__main__.py --output-dir=../dist/nuitka --output-filename=goblin --include-package=goblin --include-package-data=goblin --nofollow-import-to='*.tests' --assume-yes-for-downloads --remove-output --jobs=$(nproc) --show-progress
    silent: true
