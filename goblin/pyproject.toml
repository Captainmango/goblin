[project]
name = "goblin"
version = "0.1.0"
description = "Autonomous agent harness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "filelock>=3.0",
    "goblin-common",
    "jinja2>=3.1.6",
    "json-repair>=0.42",
    "jsonschema>=4.0",
    "notifications-relay",
    "openhands-sdk~=1.29.3",
    "openhands-tools~=1.29.3",
    "pydantic>=2.12.5",
    "pyturso>=0.6.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
goblin = "goblin.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goblin"]
force-include = {"../spec/v1.json" = "goblin/spec/v1.json"}

[tool.pyrefly]
project-includes = ["goblin/**/*.py"]

[tool.uv.sources]
goblin-common = { workspace = true }
notifications-relay = { workspace = true }

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "pyrefly>=0.54.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
    "types-pyyaml>=6.0.12.20260518",
    "vcrpy>=8.3.0",
    "zstandard>=0.25.0",
]
