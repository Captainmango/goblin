version: v1
blueprint:
  name: acp_cross_repo
  vars:
    api_dir: "."
    ui_dir: "."
  defaults:
    harness:
      type: acp
      server: custom
      command:
        - opencode
        - acp
      prompt_timeout: 1800
  phases:
    - id: api_change
      prompt: "Create a file called version.txt containing the version number 1.0.0."
      harness:
        working_dir: "{api_dir}"

    - id: ui_change
      prompt: "Read {api_dir}/version.txt and create status.txt containing the text 'Status: version <version>'."
      depends_on: [api_change]
      harness:
        working_dir: "{ui_dir}"
