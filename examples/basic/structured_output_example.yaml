# yaml-language-server: $schema=../../spec/v1.json
version: v1
blueprint:
  name: structured_output_demo
  vars: 
    input: ""
  
  phases:
    - id: classify_intent
      prompt: |
        Classify this user request as one of 'question', 'bug', or 'feature'.
        Also provide a confidence score between 0 and 1. User request: "{input}"
      allowed_tools: []
      output_schema:
        type: object
        properties:
          intent:
            type: string
            enum: [question, bug, feature]
          confidence:
            type: number
            minimum: 0
            maximum: 1
        required: [intent, confidence]
        on_failure: abort

    - id: summarise
      prompt: |
        Summarise the user request in one sentence.
      allowed_tools: []
      history:
        - classify_intent
