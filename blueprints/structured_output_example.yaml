# yaml-language-server: $schema=../spec/v1.json
version: v1
blueprint:
  name: structured_output_demo
  phases:
    - id: classify_intent
      prompt: |
        Classify this user request as one of 'question', 'bug', or 'feature'.
        Also provide a confidence score between 0 and 1.
      allowed_tools: []
      output_schema:
        type: object
        properties:
          intent:
            type: string
            enum: [question, bug, feature]
          confidence:
            type: number
            minimum: 0
            maximum: 1
        required: [intent, confidence]

    - id: summarize
      prompt: |
        Summarize the user request in one sentence.
      allowed_tools: []
      output_model: goblin.output_schema.PhaseResult
