# yaml-language-server: $schema=../spec/v1.json

version: v1
blueprint:
  name: my_blueprint
  vars:
    repo: https://github.com/parkhub/justpark.git
  defaults:
    mcp_servers:
      github:
        command: npx
        args:
          - -y
          - "@modelcontextprotocol/server-github"
        env:
          GITHUB_TOKEN: $GITHUB_TOKEN

  phases:
    - id: clone_repo
      prompt: "Clone {repo} into /tmp/justpark"
      allowed_tools: [Bash]
      on_failure:
        action: abort
    - id: load_project
      load_project: /tmp/justpark
    - id: list issues
      prompt: "List the open branches on the justpark project."
      allowed_tools:
        - "mcp__github__*"
    - id: summarise_project
      prompt: "Summarise what this project is and how it works. Use CLAUDE.md."
      allowed_tools: [Read, Glob]

# --- MCP server example (uncomment to use) ---
# To use MCP servers, add a .env file with your tokens:
#   GITHUB_TOKEN=ghp_...
#
# Then configure servers at blueprint or phase level:
