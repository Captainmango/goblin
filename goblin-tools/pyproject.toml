[project]
name = "goblin-tools"
version = "0.1.0"
description = "Shared tools and utilities for the Goblin ecosystem"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goblin_tools"]

[tool.pyrefly]
project-includes = ["goblin_tools/**/*.py"]

known-first-party = ["goblin_tools"]

[dependency-groups]
dev = [
    "pyrefly>=0.54.0",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]
