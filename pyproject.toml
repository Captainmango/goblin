[project]
name = "goblin"
version = "0.1.0"
description = "Autonomous agent harness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "jinja2>=3.1.6",
    "openhands-sdk>=1.29.3",
    "openhands-tools>=1.29.3",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
goblin = "goblin.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goblin"]

[tool.pyrefly]
project-includes = ["goblin/**/*.py"]

known-first-party = ["goblin"]

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "pyrefly>=0.54.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
    "types-pyyaml>=6.0.12.20260518",
]
